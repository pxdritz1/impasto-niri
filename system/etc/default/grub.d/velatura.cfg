# Sourced after /etc/default/grub by grub-mkconfig.
case " $GRUB_CMDLINE_LINUX_DEFAULT " in
    *" splash "*) ;;
    *) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT:+$GRUB_CMDLINE_LINUX_DEFAULT }splash" ;;
esac
